# The Notion connector (docs/architecture.md, Section 10.3). The user gives the secret of a
# Notion internal integration in the form of the web app. The secret goes to the vault entry
# connection:<id>. The tools call the Notion API (https://developers.notion.com/reference).
name: notion
title: Notion
description: Search and read the Notion pages that you share with your integration, and add pages.
kind: http_api
aliases:
- notes
- wiki
- notion pages
scopes:
- personal
- workspace
fields:
- name: token
  label: Internal integration secret
  secret: true
  help: >-
    Make an internal integration at https://www.notion.so/profile/integrations and copy its
    secret. Then share the pages with the integration in Notion.
http:
  base_url: https://api.notion.com
  auth:
    header: Authorization
    field: token
    prefix: 'Bearer '
  headers:
    Notion-Version: '2022-06-28'
  test:
    method: GET
    path: /v1/users/me
tools:
- name: notion_search
  access: read
  description: >-
    Search the pages and the databases that are shared with the integration, by title. Give no
    query to list them.
  request:
    method: POST
    path: /v1/search
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Words of the title.
      page_size:
        type: integer
        description: The most results to return (1 to 100).
        minimum: 1
        maximum: 100
      start_cursor:
        type: string
        description: The next_cursor of the previous page.
- name: notion_get_page
  access: read
  description: Read the properties of one page.
  request:
    method: GET
    path: /v1/pages/{page_id}
  input_schema:
    type: object
    properties:
      page_id:
        type: string
        description: The id of the page.
    required:
    - page_id
- name: notion_get_block_children
  access: read
  description: Read the content blocks of a page or a block.
  request:
    method: GET
    path: /v1/blocks/{block_id}/children
  input_schema:
    type: object
    properties:
      block_id:
        type: string
        description: The id of the page or the block.
      page_size:
        type: integer
        description: The most blocks to return (1 to 100).
        minimum: 1
        maximum: 100
      start_cursor:
        type: string
        description: The next_cursor of the previous page.
    required:
    - block_id
- name: notion_create_page
  access: write
  description: >-
    Add a page under a parent page or in a database. parent is {"page_id": "..."} or
    {"database_id": "..."}. properties are the Notion page properties (for a page under a page:
    {"title": [{"text": {"content": "..."}}]}). children is an optional list of Notion blocks.
  request:
    method: POST
    path: /v1/pages
  input_schema:
    type: object
    properties:
      parent:
        type: object
        description: '{"page_id": "..."} or {"database_id": "..."}.'
      properties:
        type: object
        description: The page properties.
      children:
        type: array
        description: Notion block objects for the page content.
        items:
          type: object
    required:
    - parent
    - properties
