# The Gmail connector (docs/architecture.md, Section 10.3). Composio holds the
# credential. The tool schemas are a trimmed copy of the Composio tool schemas.
name: gmail
title: Gmail
description: Read, search, draft, and send email in Gmail.
kind: composio
scopes:
- personal
- workspace
composio:
  toolkit: gmail
tools:
- name: gmail_fetch_emails
  slug: GMAIL_FETCH_EMAILS
  access: read
  description: Fetches a list of email messages from a gmail account, supporting filtering, pagination,
    and optional full content retrieval.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Gmail advanced search query (e.g., 'from:user subject:meeting'). Supports operators
          like 'from:', 'to:', 'subject:', 'label:', 'has:attachment', 'is:unread', 'after:YYYY/MM/DD',
          'before:YYYY/MM/DD', AND/OR/NOT. Use quotes for exact phrases. Omit for no query filter.
      user_id:
        type: string
        description: User's email address or 'me' for the authenticated user.
        default: me
      verbose:
        type: boolean
        description: If false, uses optimized concurrent metadata fetching for faster performance (~75%
          improvement). If true, uses standard detailed message fetching. When false, only essential fields
          (subject, sender, recipient, time, labels) are guaranteed.
        default: true
      ids_only:
        type: boolean
        description: If true, only returns message IDs from the list API without fetching individual message
          details. Fastest option for getting just message IDs and thread IDs.
        default: false
      label_ids:
        type: array
        description: 'Filter by label IDs; only messages with all specified labels are returned. Common
          IDs: ''INBOX'', ''SPAM'', ''TRASH'', ''UNREAD'', ''STARRED'', ''IMPORTANT'', ''CATEGORY_PRIMARY''
          (alias ''CATEGORY_PERSONAL''), ''CATEGORY_SOCIAL'', ''CATEGORY_PROMOTIONS'', ''CATEGORY_UPDATES'',
          ''CATEGORY_FORUMS''. Use ''listLabels'' acti...'
        items:
          type: string
      page_token:
        type: string
        description: Token for retrieving a specific page, obtained from a previous response's `nextPageToken`.
          Omit for the first page.
      max_results:
        type: integer
        description: Maximum number of messages to retrieve per page.
        default: 1
        minimum: 1
        maximum: 500
      include_payload:
        type: boolean
        description: Set to true to include full message payload (headers, body, attachments); false for
          metadata only.
        default: true
      include_spam_trash:
        type: boolean
        description: Set to true to include messages from 'SPAM' and 'TRASH'.
        default: false
- name: gmail_fetch_message_by_message_id
  slug: GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID
  access: read
  description: Fetches a specific email message by its id, provided the `message id` exists and is accessible
    to the authenticated `user id`.
  input_schema:
    type: object
    properties:
      format:
        type: string
        description: 'Format for message content: ''minimal'' (ID/labels), ''full'' (complete data), ''raw''
          (base64url string), ''metadata'' (ID/labels/headers).'
        default: full
      user_id:
        type: string
        description: User's email address or 'me' for the authenticated user.
        default: me
      message_id:
        type: string
        description: Unique ID of the email message to retrieve, obtainable from actions like 'List Messages'.
    required:
    - message_id
- name: gmail_get_profile
  slug: GMAIL_GET_PROFILE
  access: read
  description: Retrieves key gmail profile information (email address, message/thread totals, history
    id) for a user.
  input_schema:
    type: object
    properties:
      user_id:
        type: string
        description: The email address of the Gmail user whose profile is to be retrieved, or the special
          value 'me' to indicate the currently authenticated user.
        default: me
- name: gmail_create_email_draft
  slug: GMAIL_CREATE_EMAIL_DRAFT
  access: write
  description: Creates a gmail email draft, supporting to/cc/bcc, subject, plain/html body (ensure `is
    html=true` for html), attachments, and threading.
  input_schema:
    type: object
    properties:
      cc:
        type: array
        description: '''Cc'' (carbon copy) recipient email addresses.'
        default: []
        items:
          type: string
      bcc:
        type: array
        description: '''Bcc'' (blind carbon copy) recipient email addresses.'
        default: []
        items:
          type: string
      body:
        type: string
        description: Email body content (plain text or HTML); `is_html` must be True if HTML.
      is_html:
        type: boolean
        description: Set to True if `body` is HTML, otherwise the action may fail.
        default: false
      subject:
        type: string
        description: Email subject line.
      user_id:
        type: string
        description: User's email address or 'me' for the authenticated user.
        default: me
      thread_id:
        type: string
        description: ID of an existing Gmail thread to reply to; omit for new thread.
      attachment:
        description: File to attach to the email.
        type: object
      recipient_email:
        type: string
        description: Primary recipient's email address.
      extra_recipients:
        type: array
        description: Additional 'To' recipient email addresses.
        default: []
        items:
          type: string
    required:
    - recipient_email
    - subject
    - body
- name: gmail_send_email
  slug: GMAIL_SEND_EMAIL
  access: write
  description: Sends an email via gmail api using the authenticated user's google profile display name,
    requiring `is html=true` if the body contains html and valid `s3key`, `mimetype`, `name` for any attachment.
  input_schema:
    type: object
    properties:
      cc:
        type: array
        description: Carbon Copy (CC) recipients' email addresses.
        default: []
        items:
          type: string
      bcc:
        type: array
        description: Blind Carbon Copy (BCC) recipients' email addresses.
        default: []
        items:
          type: string
      body:
        type: string
        description: Email content (plain text or HTML); if HTML, `is_html` must be `True`.
      is_html:
        type: boolean
        description: Set to `True` if the email body contains HTML tags.
        default: false
      subject:
        type: string
        description: Subject line of the email.
      user_id:
        type: string
        description: User's email address; the literal 'me' refers to the authenticated user.
        default: me
      attachment:
        description: File to attach; ensure `s3key`, `mimetype`, and `name` are set if provided. Omit
          or set to null for no attachment.
        type: object
      recipient_email:
        type: string
        description: Primary recipient's email address.
      extra_recipients:
        type: array
        description: Additional 'To' recipients' email addresses (not Cc or Bcc).
        default: []
        items:
          type: string
    required:
    - recipient_email
    - body
- name: gmail_move_to_trash
  slug: GMAIL_MOVE_TO_TRASH
  access: destructive
  description: Moves an existing, non-deleted email message to the trash for the specified user.
  input_schema:
    type: object
    properties:
      user_id:
        type: string
        description: User's email address or 'me' for the authenticated user.
        default: me
      message_id:
        type: string
        description: Identifier of the email message to move to trash.
    required:
    - message_id
