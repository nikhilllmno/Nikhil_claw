# The Google Drive connector (docs/architecture.md, Section 10.3). Composio holds the
# credential. The tool schemas are a trimmed copy of the Composio tool schemas.
name: googledrive
title: Google Drive
description: Find, read, and create files and folders in Google Drive.
kind: composio
aliases:
- drive
- gdrive
- google docs
- docs
- files
scopes:
- personal
- workspace
composio:
  toolkit: googledrive
tools:
- name: googledrive_find_file
  slug: GOOGLEDRIVE_FIND_FILE
  access: read
  description: Tool to list or search for files and folders in google drive. use when you need to find
    specific files based on query criteria or list contents of a drive/folder.
  input_schema:
    type: object
    properties:
      q:
        type: string
        description: 'A query for filtering the file results. See Google Drive API documentation for query
          syntax. Example: \"name contains ''report'' and mimeType = ''application/pdf''\"'
      fields:
        type: string
        default: '*'
        description: Selector specifying which fields to include in a partial response. Use '*' for all
          fields or a comma-separated list, e.g., 'nextPageToken,files(id,name,mimeType)'.
      spaces:
        type: string
        default: drive
        description: A comma-separated list of spaces to query. Supported values are 'drive', 'appDataFolder'
          and 'photos'.
      corpora:
        enum:
        - user
        - drive
        - domain
        - allDrives
        type: string
        description: Corpora to query. 'user' for user's personal files, 'drive' for files in a specific
          shared drive (requires 'driveId'), 'domain' for files shared with the domain, 'allDrives' for
          all drives the user has access to.
      driveId:
        type: string
        description: ID of the shared drive to search. Required if 'corpora' is 'drive'.
      orderBy:
        type: string
        description: 'A comma-separated list of sort keys. Valid keys are ''createdTime'', ''folder'',
          ''modifiedByMeTime'', ''modifiedTime'', ''name'', ''name_natural'', ''quotaBytesUsed'', ''recency'',
          ''sharedWithMeTime'', ''starred'', and ''viewedByMeTime''. Each key sorts ascending by default,
          but may be reversed with the ''desc'' modifier. Example: ''modifiedTime desc,name''.'
      pageSize:
        type: integer
        default: 100
        description: The maximum number of files to return per page.
      pageToken:
        type: string
        description: The token for continuing a previous list request on the next page.
      supportsAllDrives:
        type: boolean
        default: true
        description: Whether the requesting application supports both My Drives and shared drives. If
          'includeItemsFromAllDrives' is true, this must also be true.
      includeItemsFromAllDrives:
        type: boolean
        default: false
        description: Whether both My Drive and shared drive items should be included in results. If true,
          'supportsAllDrives' should also be true.
- name: googledrive_list_files
  slug: GOOGLEDRIVE_LIST_FILES
  access: read
  description: Tool to list a user's files and folders in google drive. use this to search or browse for
    files and folders based on various criteria.
  input_schema:
    type: object
    properties:
      q:
        type: string
        description: 'A query string for filtering the file results. Supports operators like ''and'',
          ''or'', ''not'', and can filter on fields like ''name'', ''mimeType'', ''modifiedTime'', ''starred'',
          ''trashed''. Example: "name contains ''important'' and mimeType = ''application/vnd.google-apps.folder''".'
      fields:
        type: string
        description: 'Selector specifying which fields to include in a partial response. This can be used
          to retrieve only specific file metadata, improving performance. Example: ''nextPageToken, files(id,
          name, mimeType, modifiedTime)'''
      spaces:
        type: string
        description: A comma-separated list of spaces to query within the corpora. Supported values are
          'drive' and 'appDataFolder'. 'drive' represents files in My Drive and shared drives, while 'appDataFolder'
          represents the application's private data folder.
      corpora:
        type: string
        description: Specifies the bodies of items (files/documents) to which the query applies. Supported
          values are 'user', 'domain', 'drive', and 'allDrives'. It's generally more efficient to use
          'user' or 'drive' instead of 'allDrives'. Defaults to 'user'.
      driveId:
        type: string
        description: The ID of the shared drive to search. This is used when `corpora` is set to 'drive'.
      orderBy:
        type: string
        description: A comma-separated list of sort keys. Valid keys include 'createdTime', 'folder',
          'modifiedByMeTime', 'modifiedTime', 'name', 'name_natural', 'quotaBytesUsed', 'recency', 'sharedWithMeTime',
          'starred', 'viewedByMeTime'. Each key sorts in ascending order by default, but can be reversed
          with the 'desc' modifier (e.g., 'modifiedTime desc').
      folderId:
        type: string
        description: ID of a specific folder to list files from. This is a convenience parameter that
          automatically adds "'folder_id' in parents" to the query. Cannot be used together with a custom
          'q' parameter.
      pageSize:
        type: integer
        default: 100
        description: The maximum number of files to return per page. The value must be between 1 and 1000,
          inclusive. Defaults to 100.
      pageToken:
        type: string
        description: The token for continuing a previous list request on the next page. This should be
          set to the value of 'nextPageToken' from the previous response.
      includeLabels:
        type: string
        description: A comma-separated list of label IDs to include in the `labelInfo` part of the response
          for each file.
      supportsAllDrives:
        type: boolean
        description: Whether the requesting application supports both My Drives and shared drives. Defaults
          to false. If true, then `includeItemsFromAllDrives` can be used to extend the search to all
          drives.
      includeItemsFromAllDrives:
        type: boolean
        description: Whether to include items from both My Drive and shared drives. This is relevant when
          `corpora` is 'user' or 'domain'. Defaults to false.
      includePermissionsForView:
        type: string
        description: Specifies which additional view's permissions to include in the response. Currently,
          only 'published' is supported, which includes permissions for files with published content.
- name: googledrive_get_file_metadata
  slug: GOOGLEDRIVE_GET_FILE_METADATA
  access: read
  description: Tool to get a file's metadata by id. use when you need to retrieve the metadata for a specific
    file in google drive.
  input_schema:
    type: object
    required:
    - fileId
    properties:
      fileId:
        type: string
        description: The ID of the file.
      includeLabels:
        type: string
        description: A comma-separated list of IDs of labels to include in the labelInfo part of the response.
      acknowledgeAbuse:
        type: boolean
        description: Whether the user is acknowledging the risk of downloading known malware or other
          abusive files. This is only applicable when the alt parameter is set to media and the user is
          the owner of the file or an organizer of the shared drive in which the file resides.
      supportsAllDrives:
        type: boolean
        description: Whether the requesting application supports both My Drives and shared drives. This
          parameter will default to false.
      includePermissionsForView:
        type: string
        description: Specifies which additional view's permissions to include in the response. Only 'published'
          is supported.
- name: googledrive_download_file
  slug: GOOGLEDRIVE_DOWNLOAD_FILE
  access: read
  description: Downloads a file from google drive by its id. for google workspace documents (docs, sheets,
    slides), optionally exports to a specified `mime type`. for other file types, downloads in their native
    format regardless of mime type.
  input_schema:
    type: object
    required:
    - file_id
    properties:
      file_id:
        type: string
        description: The unique identifier of the file to be downloaded from Google Drive. This ID can
          typically be found in the file's URL in Google Drive or obtained from API calls that list files.
      mime_type:
        enum:
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.oasis.opendocument.text
        - application/rtf
        - application/pdf
        - text/plain
        - application/zip
        - application/epub+zip
        - text/markdown
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/x-vnd.oasis.opendocument.spreadsheet
        - text/csv
        - text/tab-separated-values
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/vnd.oasis.opendocument.presentation
        - image/jpeg
        - image/png
        - image/svg+xml
        - application/vnd.google-apps.script+json
        - application/vnd.google-apps.vid
        type: string
        description: Target MIME type for exporting Google Workspace documents (e.g., Google Doc, Sheet,
          Slide). Supported export formats vary by file type; e.g., text/plain is only supported for Google
          Docs, not Sheets or Slides. This parameter is automatically ignored for non-Google Workspace
          files, which are downloaded in their native format. Only specify this when you want to export
          a Google Workspace document to a different format (e.g., export Google Doc to PDF).
- name: googledrive_create_file_from_text
  slug: GOOGLEDRIVE_CREATE_FILE_FROM_TEXT
  access: write
  description: Creates a new file in google drive from provided text content (up to 10mb), supporting
    various formats including automatic conversion to google workspace types.
  input_schema:
    type: object
    required:
    - file_name
    - text_content
    properties:
      file_name:
        type: string
        description: Desired name for the new file on Google Drive.
      mime_type:
        type: string
        default: text/plain
        description: MIME type for the new file, determining how Google Drive interprets its content.
      parent_id:
        type: string
        description: ID of the parent folder in Google Drive; if omitted, the file is created in the root
          of 'My Drive'.
      text_content:
        type: string
        description: Plain text content to be written into the new file.
- name: googledrive_create_folder
  slug: GOOGLEDRIVE_CREATE_FOLDER
  access: write
  description: Creates a new folder in google drive, optionally within a parent folder specified by its
    id or name; if a parent name is provided but not found, the action will fail.
  input_schema:
    type: object
    required:
    - folder_name
    properties:
      parent_id:
        type: string
        description: ID or name of the parent folder. If a name is provided, the action attempts to find
          it. If an ID is provided, it must be a valid Google Drive folder ID. If omitted, the folder
          is created in the Drive root.
      folder_name:
        type: string
        description: Name for the new folder.
- name: googledrive_delete_file
  slug: GOOGLEDRIVE_GOOGLE_DRIVE_DELETE_FOLDER_OR_FILE_ACTION
  access: destructive
  description: 'Tool to delete a file or folder in google drive. use when you need to permanently remove
    a specific file or folder using its id. note: this action is irreversible.'
  input_schema:
    type: object
    required:
    - fileId
    properties:
      fileId:
        type: string
        description: The ID of the file or folder to delete. This is a required field.
      supportsAllDrives:
        type: boolean
        description: Whether the application supports both My Drives and shared drives. If false or unspecified,
          the file is attempted to be deleted from the user's My Drive. If true, the item will be deleted
          from shared drives as well if necessary.
