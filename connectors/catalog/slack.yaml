# The Slack connector (docs/architecture.md, Section 10.3). Composio holds the
# credential. The tool schemas are a trimmed copy of the Composio tool schemas.
name: slack
title: Slack
description: Read channels and messages in Slack, and send messages as the connected user.
kind: composio
aliases:
- slack account
- slack messages
scopes:
- personal
- workspace
composio:
  toolkit: slack
tools:
- name: slack_find_channels
  slug: SLACK_FIND_CHANNELS
  access: read
  description: Find channels in a slack workspace by any criteria - name, topic, purpose, or description.
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        description: Maximum number of channels to return (1 to 200). Defaults to 50.
        default: 50
      types:
        type: string
        description: 'Comma-separated list of channel types to include: `public_channel`, `private_channel`,
          `mpim` (multi-person direct message), `im` (direct message). Defaults to public and private
          channels.'
        default: public_channel,private_channel
      exact_match:
        type: boolean
        description: Use exact matching instead of partial matching. Defaults to false.
        default: false
      member_only:
        type: boolean
        description: Only return channels the user is a member of. Defaults to false.
        default: false
      search_query:
        type: string
        description: Search query to find channels. Searches across channel name, topic, purpose, and
          description (case-insensitive partial matching).
      exclude_archived:
        type: boolean
        description: Exclude archived channels from search results. Defaults to true.
        default: true
    required:
    - search_query
- name: slack_fetch_conversation_history
  slug: SLACK_FETCH_CONVERSATION_HISTORY
  access: read
  description: Fetches a chronological list of messages and events from a specified slack conversation,
    accessible by the authenticated user/bot, with options for pagination and time range filtering.
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        description: Maximum number of messages to return per page (1-1000). Fewer may be returned if
          at the end of history or channel has fewer messages.
      cursor:
        type: string
        description: Pagination cursor from `next_cursor` of a previous response to fetch subsequent pages.
          See Slack's pagination documentation for details.
      latest:
        type: string
        description: End of the time range of messages to include in results. Accepts a Unix timestamp
          or a Slack timestamp (e.g., '1234567890.000000').
      oldest:
        type: string
        description: Start of the time range of messages to include in results. Accepts a Unix timestamp
          or a Slack timestamp (e.g., '1234567890.000000').
      channel:
        type: string
        description: The ID of the public channel, private channel, direct message, or multi-person direct
          message to fetch history from.
      inclusive:
        type: boolean
        description: Include messages with `latest` or `oldest` timestamps in the results; applies only
          when `latest` or `oldest` is specified.
    required:
    - channel
- name: slack_find_users
  slug: SLACK_FIND_USERS
  access: read
  description: Find users in a slack workspace by any criteria - email, name, display name, or other text.
    includes optimized email lookup for exact email matches.
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        description: Maximum number of users to return (1 to 200). Defaults to 50.
        default: 50
      exact_match:
        type: boolean
        description: Use exact matching instead of partial matching. Defaults to false.
        default: false
      include_bots:
        type: boolean
        description: Include bot users in search results. Defaults to false.
        default: false
      search_query:
        type: string
        description: Search query to find users. Searches across name, display name, real name, email
          address, first name, last name, and status text (case-insensitive partial matching). For exact
          email matches with exact_match=true, uses Slack's efficient email lookup endpoint.
      include_deleted:
        type: boolean
        description: Include deleted/deactivated users in search results. Defaults to false.
        default: false
      include_restricted:
        type: boolean
        description: Include restricted (guest) users in search results. Defaults to true.
        default: true
    required:
    - search_query
- name: slack_send_message
  slug: SLACK_SEND_MESSAGE
  access: write
  description: Posts a message to a slack channel, direct message, or private group; requires content
    via `text`, `blocks`, or `attachments`.
  input_schema:
    type: object
    properties:
      text:
        type: string
        description: 'DEPRECATED: This sends raw text only, use markdown_text field. Primary textual content.
          Recommended fallback if using `blocks` or `attachments`. Supports mrkdwn unless `mrkdwn` is
          `false`.'
      parse:
        type: string
        description: 'Message text parsing behavior. Default `none` (no special parsing). `full` parses
          as user-typed (links @mentions, #channels). See Slack API docs for details.'
      blocks:
        type: string
        description: 'DEPRECATED: Use `markdown_text` field instead. URL-encoded JSON array of layout
          blocks for rich/interactive messages. See Slack API Block Kit docs for structure.'
      mrkdwn:
        type: boolean
        description: Disable Slack's markdown for `text` field if `false`. Default `true` (allows *bold*,
          _italic_, etc.).
      as_user:
        type: boolean
        description: Post as the authenticated user instead of as a bot. Defaults to `false`. If `true`,
          `username`, `icon_emoji`, and `icon_url` are ignored. If `false`, the message is posted as a
          bot, allowing appearance customization.
      channel:
        type: string
        description: ID or name of the channel, private group, or IM channel to send the message to.
      icon_url:
        type: string
        description: Image URL for bot's icon (must be HTTPS). Applies if `as_user` is `false`.
      username:
        type: string
        description: Bot's name in Slack (max 80 chars). Applies if `as_user` is `false`.
      thread_ts:
        type: string
        description: 'Timestamp (`ts`) of an existing message to make this a threaded reply. Use `ts`
          of the parent message, not another reply. Example: ''1476746824.000004''.'
      icon_emoji:
        type: string
        description: Emoji for bot's icon (e.g., ':robot_face:'). Overrides `icon_url`. Applies if `as_user`
          is `false`.
      link_names:
        type: boolean
        description: 'Automatically hyperlink channel names (e.g., #channel) and usernames (e.g., @user)
          in message text. Defaults to `false` for bot messages.'
      attachments:
        type: string
        description: URL-encoded JSON array of message attachments, a legacy method for rich content.
          See Slack API documentation for structure.
      unfurl_links:
        type: boolean
        description: Enable unfurling of text-based URLs. Defaults `false` for bots, `true` if `as_user`
          is `true`.
      unfurl_media:
        type: boolean
        description: Disable unfurling of media content from URLs if `false`. Defaults to `true`.
      markdown_text:
        type: string
        description: 'PREFERRED: Write your message in markdown for nicely formatted display. Supports:
          headers (# ## ###), bold (**text** or __text__), italic (*text* or _text_), strikethrough (~~text~~),
          inline code (`code`), code blocks (```), links ([text](url)), block quotes (>), lists (- item,
          1. item), dividers...'
      reply_broadcast:
        type: boolean
        description: If `true` for a threaded reply, also posts to main channel. Defaults to `false`.
    required:
    - channel
