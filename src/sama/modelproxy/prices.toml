# Media models (Section 11.8). Only the media tools of sama call them. The proxy does not
# allow them.
# `gpt-image-2.6-flare`: text input, cached text input, and image output tokens.
[openai.media."gpt-image-2.6-flare"]
input = "5"
output = "30"
cache_read = "1.25"
cache_write = "0"
cache_write_long = "0"

# `tts-1` costs USD 15 per million characters. The meter records one input token for each
# character.
[openai.media."tts-1"]
input = "15"
output = "0"
cache_read = "0"
cache_write = "0"
cache_write_long = "0"
