# Model prices for the model proxy (docs/architecture.md, Section 16.6).
#
# All prices are USD per million tokens. A model that is not in this file is not allowed.
# `cache_write` is the short cache write (Anthropic 5 minutes, OpenAI 30 minutes).
# `cache_write_long` is the long cache write (Anthropic 1 hour, OpenAI 12 hours).
# `long_context` is the price set for a call whose prompt is more than `above_tokens`.
#
# Sources, read on 2026-11-18:
# - https://platform.claude.com/docs/en/about-claude/pricing
# - https://developers.openai.com/api/docs/pricing
# - https://developers.openai.com/api/docs/guides/prompt-caching (cache write rates)

[anthropic]
web_search_per_1k = "10"

[anthropic.models.claude-fable-5-2]
input = "8"
output = "40"
cache_read = "0.20"
cache_write = "10"
cache_write_long = "16"

[anthropic.models.claude-opus-5-5]
input = "4"
output = "20"
cache_read = "0.20"
cache_write = "5"
cache_write_long = "8"

[anthropic.models.claude-opus-5]
input = "5"
output = "25"
cache_read = "0.50"
cache_write = "6.25"
cache_write_long = "10"

[anthropic.models.claude-sonnet-5-5]
input = "2"
output = "10"
cache_read = "0.10"
cache_write = "2.50"
cache_write_long = "4"

[anthropic.models.claude-sonnet-5]
