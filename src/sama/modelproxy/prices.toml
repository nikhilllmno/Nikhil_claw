input = "0.50"
output = "2.50"
cache_read = "0.05"
cache_write = "0.625"
cache_write_long = "1"

[anthropic.models.claude-haiku-4-5]
input = "1"
output = "5"
cache_read = "0.10"
cache_write = "1.25"
cache_write_long = "2"

