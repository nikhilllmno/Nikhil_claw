<!doctype html>
<html><head><meta charset="utf-8"><title>Canvas quest 0/6</title>
<style>html,body{margin:0;padding:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="540"></canvas>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d');
let seed = Number(new URLSearchParams(location.search).get('seed') || 0);
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
const L = {
  circles: {1: [120, 130], 2: [420, 100], 3: [270, 230]},
  diamond: [640, 130], hover: [680, 260], square: [110, 380], box: [600, 380],
  text: [410, 320], gauge: [400, 495],
};
if (seed > 0) {
  const slots = [L.circles[1], L.circles[2], L.circles[3]];
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]];
  }
  [1, 2, 3].forEach((n, i) => {
    L.circles[n] = [slots[i][0] + Math.round(rnd() * 60 - 30), slots[i][1] + Math.round(rnd() * 30 - 15)];
  });
  if (rnd() < 0.5) { const s = L.square; L.square = [L.box[0], s[1]]; L.box = [s[0] + 40, L.box[1]]; }
  L.diamond = [L.diamond[0] + Math.round(rnd() * 60 - 30), L.diamond[1]];
  L.hover = [L.hover[0] + Math.round(rnd() * 40 - 20), L.hover[1] + Math.round(rnd() * 20 - 10)];
}
const S = {next: 1, circles: false, diamond: false, hover: false, drag: false, text: false,
  gauge: 0, gaugeDone: false, typing: false, typed: '', sq: L.square.slice(), dragging: null};
window.quest = S;
function done() {
  return [S.circles, S.diamond, S.hover, S.drag, S.text, S.gaugeDone].filter(Boolean).length;
}
function inCircle(p, ctr, r) { return Math.hypot(p[0] - ctr[0], p[1] - ctr[1]) <= r; }
function inRect(p, ctr, w, h) { return Math.abs(p[0] - ctr[0]) <= w / 2 && Math.abs(p[1] - ctr[1]) <= h / 2; }
function pos(e) { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function draw() {
  g.clearRect(0, 0, c.width, c.height);
  g.font = '16px sans-serif'; g.fillStyle = '#222'; g.textAlign = 'left';
  g.fillText('Steps: (1) click circles 1, 2, 3 in order  (2) double-click the blue diamond', 10, 22);
  g.fillText('(3) hover the yellow circle  (4) drag the red square into the dashed box', 10, 42);
  g.fillText('(5) click the text box, type sama, press Enter  (6) scroll down over the gauge', 10, 62);
  for (const n of [1, 2, 3]) {
    const [x, y] = L.circles[n];
    g.beginPath(); g.arc(x, y, 30, 0, Math.PI * 2);
    g.fillStyle = (S.circles || S.next > n) ? '#2a2' : '#888'; g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 24px sans-serif'; g.textAlign = 'center';
    g.fillText(String(n), x, y + 8);
  }
  const [dx, dy] = L.diamond;
  g.beginPath(); g.moveTo(dx, dy - 32); g.lineTo(dx + 32, dy); g.lineTo(dx, dy + 32); g.lineTo(dx - 32, dy);
  g.closePath(); g.fillStyle = S.diamond ? '#2a2' : '#2255dd'; g.fill();
  const [hx, hy] = L.hover;
  g.beginPath(); g.arc(hx, hy, 28, 0, Math.PI * 2); g.fillStyle = S.hover ? '#2a2' : '#e8c400'; g.fill();
  g.fillStyle = '#222'; g.font = '14px sans-serif'; g.textAlign = 'center'; g.fillText('hover', hx, hy + 5);
  const [bx, by] = L.box;
  g.setLineDash([8, 6]); g.strokeStyle = S.drag ? '#2a2' : '#333'; g.lineWidth = 3;
  g.strokeRect(bx - 45, by - 45, 90, 90); g.setLineDash([]);
  g.fillStyle = S.drag ? '#2a2' : '#d22'; g.fillRect(S.sq[0] - 25, S.sq[1] - 25, 50, 50);
  const [tx, ty] = L.text;
  g.strokeStyle = S.typing ? '#2255dd' : '#555'; g.lineWidth = 2; g.strokeRect(tx - 110, ty - 20, 220, 40);
  g.fillStyle = '#222'; g.font = '18px monospace'; g.textAlign = 'left';
  g.fillText(S.text ? 'sama' : (S.typed || (S.typing ? '|' : 'text box')), tx - 100, ty + 6);
  const [gx, gy] = L.gauge;
  g.strokeStyle = '#333'; g.strokeRect(gx - 360, gy - 15, 720, 30);
  g.fillStyle = S.gaugeDone ? '#2a2' : '#2255dd';
  g.fillRect(gx - 360, gy - 15, 720 * Math.min(1, S.gauge / 600), 30);
  g.fillStyle = '#222'; g.font = '14px sans-serif'; g.textAlign = 'center';
  g.fillText('gauge: scroll down here', gx, gy + 5);
  const n = done();
  if (n === 6) {
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#2a2'; g.font = 'bold 72px sans-serif'; g.textAlign = 'center';
    g.fillText('SOLVED', c.width / 2, c.height / 2);
    document.title = 'Canvas quest - solved';
  } else {
    document.title = 'Canvas quest ' + n + '/6';
  }
}
c.addEventListener('mousedown', e => {
  const p = pos(e);
  if (!S.drag && inRect(p, S.sq, 50, 50)) { S.dragging = [p[0] - S.sq[0], p[1] - S.sq[1]]; return; }
  S.typing = inRect(p, L.text, 220, 40) && !S.text;
  for (const n of [1, 2, 3]) {
    if (!S.circles && inCircle(p, L.circles[n], 30)) {
      if (n === S.next) { S.next += 1; if (S.next === 4) S.circles = true; } else { S.next = 1; }
    }
  }
  draw();
});
c.addEventListener('mousemove', e => {
  const p = pos(e);
  if (S.dragging) { S.sq = [p[0] - S.dragging[0], p[1] - S.dragging[1]]; }
  if (!S.hover && inCircle(p, L.hover, 28)) S.hover = true;
  draw();
});
window.addEventListener('mouseup', () => {
  if (!S.dragging) return;
  S.dragging = null;
  if (inRect(S.sq, L.box, 60, 60)) { S.drag = true; S.sq = L.box.slice(); }
  draw();
});
c.addEventListener('dblclick', e => { if (inRect(pos(e), L.diamond, 46, 46)) { S.diamond = true; draw(); } });
c.addEventListener('wheel', e => {
  if (!inRect(pos(e), L.gauge, 720, 30)) return;
  e.preventDefault();
  if (e.deltaY > 0) S.gauge += e.deltaY;
  if (S.gauge >= 600) S.gaugeDone = true;
  draw();
}, {passive: false});
document.addEventListener('keydown', e => {
  if (!S.typing || S.text) return;
  if (e.key === 'Enter') {
    if (S.typed.trim().toLowerCase() === 'sama') { S.text = true; S.typing = false; } else { S.typed = ''; }
  } else if (e.key === 'Backspace') { S.typed = S.typed.slice(0, -1); }
  else if (e.key.length === 1 && S.typed.length < 20) { S.typed += e.key; }
  e.preventDefault();
  draw();
});
draw();
</script></body></html>
