[project]
name = "sama"
version = "0.1.0"
description = "Cloud, multi-user assistant engine on the Claude Agent SDK and the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32.0,<0.33",
    "cryptography>=50.0.2,<51",
    "fastapi>=0.120,<1",
    "httpx>=0.28.1,<1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.3,<3",
    "pyjwt>=2.10.1,<3",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "starlette>=1.10.0,<2",
    "uvicorn>=0.54.0,<1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0,<0.33",
    "mypy>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "ruff>=0.17.5,<0.18",
    "types-pyyaml>=6,<7",
    "uvicorn>=0.54.0,<1",
]
# Each runtime adapter pins its SDK (docs/architecture.md, Section 5.3).
# Both are default groups, so the conformance suite runs both runtimes. The sandbox image
# installs both, and the control plane image installs neither.
runtime-claude = [
    "claude-agent-sdk==0.2.184",
]
runtime-openai = [
    "openai-agents==0.25.0",
]
# The control plane creates E2B sandboxes (docs/architecture.md, Section 16.2). The sandbox
# image does not install this group.
sandbox-e2b = [
    "e2b>=2.64.0,<3",
]

[tool.uv]
default-groups = ["dev", "runtime-claude", "runtime-openai", "sandbox-e2b"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake tokens and run the interpreter in a subprocess.
"tests/**" = ["S101", "S105", "S106", "S107", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Prints the stacks of all threads when one test runs longer (tests/conftest.py has the time
# limit that fails the test).
faulthandler_timeout = 300
markers = [
    "live: calls a real external service. Runs only with SAMA_LIVE_TESTS=1.",
]
