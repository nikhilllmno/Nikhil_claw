[project]
name = "sama"
version = "0.1.0"
description = "Cloud, multi-user assistant engine on the Claude Agent SDK and the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.14.3,<3",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "ruff>=0.17.5,<0.18",
]
# Each runtime adapter pins its SDK (docs/architecture.md, Section 5.3).
# Install with `uv sync --group runtime-claude` or `uv sync --group runtime-openai`.
runtime-claude = [
    "claude-agent-sdk==0.2.184",
]
runtime-openai = [
    "openai-agents==0.25.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake tokens and run the interpreter in a subprocess.
"tests/**" = ["S101", "S105", "S106", "S107", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
