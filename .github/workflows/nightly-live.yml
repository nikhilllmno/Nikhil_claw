name: Nightly live

# Runs the runtime conformance suite and the Claude adapter live tests against the real
# Claude API (docs/architecture.md, Section 5.5). It needs the repository secret
# ANTHROPIC_API_KEY.
#
# The e2b job builds the E2B template sama-runner from main and runs the E2B provider tests
# (Section 16.2). It needs the repository secret E2B_API_KEY.
#
# Cost: all live tests share one cap (tests/live_budget.py). Each run gets the rest of the cap
# as max_budget_usd, and a test fails before it calls the model when the cap is used up. The
# CLI checks the budget after each model turn, so the total can pass the cap by one turn.

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.8"

jobs:
  live:
    name: Live runtime suite (Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY. Without it the live tests skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Live conformance suite and adapter tests
        env:
          SAMA_LIVE_TESTS: "1"
          SAMA_LIVE_MAX_COST_USD: "0.50"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # -rs lists skipped tests. A live test that skips here means a missing setting.
        run: uv run pytest -m live tests/conformance tests/runtime -rs

  e2b:
    name: Live sandbox suite (E2B)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the API key
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::Add the repository secret E2B_API_KEY. Without it the live tests skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The template follows main. E2B caches the layers, so a build without changes is fast.
      - name: Build the E2B template sama-runner
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: uv run python -m sama.sandbox.template
      - name: E2B provider tests
        env:
          SAMA_LIVE_TESTS: "1"
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: uv run pytest -m live tests/sandbox -rs
