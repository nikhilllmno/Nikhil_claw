name: Nightly live

# Runs the runtime conformance suite and the Claude adapter live tests against the real
# Claude API (docs/architecture.md, Section 5.5). Each run has a cost limit of USD 0.50.
# It needs the repository secret ANTHROPIC_API_KEY.

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.8"

jobs:
  live:
    name: Live runtime suite (Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY. Without it the live tests skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Live conformance suite and adapter tests
        env:
          SAMA_LIVE_TESTS: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # -rs lists skipped tests. A live test that skips here means a missing setting.
        run: uv run pytest -m live tests/conformance tests/runtime -rs
