name: Deploy

# Deploys main to staging after CI passes on main, and promotes a staging image to production
# by hand (docs/architecture.md, Section 19.3).
#
# - Staging: each push to main that passes CI. The release command applies the migrations.
# - Production: run this workflow by hand with the commit to promote. It deploys the image
#   that staging built for that commit, so production runs the tested image.
#
# Each deploy builds the E2B template sama-runner-<content hash>, and sets SAMA_SANDBOX_TEMPLATE
# to it. The hash covers the Dockerfile, the dependency files, and the source files that the
# sandbox can import (`python -m sama.sandbox.template --print-alias`). The runner in the sandbox
# then always has the runner code of the control plane that starts it, and a deploy that does
# not change the sandbox keeps the session sandboxes (docs/architecture.md, Section 19.3).
#
# Each GitHub environment (staging, production) needs the secret FLY_API_TOKEN. The template
# build needs the repository secret E2B_API_KEY.
#
# The last step of each deploy job sends one release notification (a JSON POST) to the URL in
# the secret VORFLUX_RELEASE_WEBHOOK_URL (repository or environment secret), also when the
# deploy fails or is cancelled. Without the secret, the steps do not run. A failed
# notification never fails the deploy (scripts/release-notify.sh).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The full commit SHA on main to promote to production.
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.13.8"
  FLYCTL_VERSION: "0.5.13"
  FLYCTL_SHA256: "f1ae6fc1d0151d9a3a0086d22e0552e33cf9ab6f8f9c7c2baf7daa96d3ee0870"

jobs:
  staging:
    name: Deploy to staging
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      # The fragment names the deployed image. GitHub records the tip of main as the commit of
      # the deployment, so the release notification reads the deployed commit from here.
      url: https://sama-staging.fly.dev/#main-${{ github.event.workflow_run.head_sha }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # deployments: read finds the last successful deployment for the release notification.
    permissions:
      contents: read
      deployments: read
    env:
      RELEASE_WEBHOOK_SET: ${{ secrets.VORFLUX_RELEASE_WEBHOOK_URL != '' }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install flyctl (pinned, checksum verified)
        run: |
          curl -sSfL -o flyctl.tgz \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  flyctl.tgz" | sha256sum --check --strict
          tar -xzf flyctl.tgz flyctl
          rm flyctl.tgz
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The build is the same for the same content, and E2B caches the layers, so a build of an
      # alias that exists is fast. It makes sure that the template exists.
      - name: Build the E2B template of the commit
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::Add the repository secret E2B_API_KEY."
            exit 1
          fi
          uv sync --locked
          # A commit from before the content alias has no --print-alias. It keeps the alias
          # of its commit, so a promotion or a rollback to it still works.
          if uv run python -m sama.sandbox.template --help | grep -q -- --print-alias; then
            ALIAS="$(uv run python -m sama.sandbox.template --print-alias)"
          else
            ALIAS="sama-runner-${SHA:0:12}"
          fi
          echo "TEMPLATE_ALIAS=${ALIAS}" >> "$GITHUB_ENV"
          uv run python -m sama.sandbox.template --alias "${ALIAS}"
      # The Chrome extension for the download of the web app (M8.3). The build has a
      # placeholder API address; the API puts its own address in each download, so the image
      # that production gets from staging serves both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the Chrome extension
        working-directory: extension
        run: |
          npm ci
          SAMA_API_URL=https://sama-api.invalid npm run build
          (cd dist && zip -qr ../../deploy/sama-extension.zip .)
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          ./flyctl deploy --config deploy/fly.staging.toml --remote-only --ha=false
          --image-label "main-${SHA}" --wait-timeout 10m
          --env "SAMA_SANDBOX_TEMPLATE=${TEMPLATE_ALIAS}"
      - name: Check the health of each part
        run: |
          for path in /healthz /tools/healthz /model/healthz; do
            curl -sSf --retry 10 --retry-all-errors --retry-delay 3 --max-time 10 \
              "https://sama-staging.fly.dev${path}" > /dev/null
          done
      # The release notification (docs/architecture.md, Section 19.3). It runs also when the
      # deploy fails or is cancelled, and it never fails the job. The script comes from the
      # commit of this workflow, because an older deployed commit does not have it.
      - name: Check out the release notification script
        if: always() && env.RELEASE_WEBHOOK_SET == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-notify
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/release-notify.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Send the release notification
        if: always() && env.RELEASE_WEBHOOK_SET == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.VORFLUX_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_SERVICE: sama
          DEPLOY_SHA: ${{ env.SHA }}
          DEPLOY_REF: refs/heads/${{ github.event.workflow_run.head_branch }}
          DEPLOY_IMAGE_LABEL: main-${{ env.SHA }}
          RELEASE_NOTIFY_GIT_DIR: .release-notify
        run: bash .release-notify/scripts/release-notify.sh || true

  production:
    name: Promote to production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      # The fragment names the deployed image (see the staging job).
      url: https://sama-production.fly.dev/#main-${{ inputs.sha }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # deployments: read finds the last successful deployment for the release notification.
    permissions:
      contents: read
      deployments: read
    env:
      RELEASE_WEBHOOK_SET: ${{ secrets.VORFLUX_RELEASE_WEBHOOK_URL != '' }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check the commit
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Give the full 40-character commit SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use the config of that commit, and only a commit on main
        run: |
          git merge-base --is-ancestor "$SHA" origin/main
          git checkout --quiet "$SHA"
      - name: Install flyctl (pinned, checksum verified)
        run: |
          curl -sSfL -o flyctl.tgz \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  flyctl.tgz" | sha256sum --check --strict
          tar -xzf flyctl.tgz flyctl
          rm flyctl.tgz
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The build is the same for the same content, and E2B caches the layers, so a build of an
      # alias that exists is fast. It makes sure that the template exists.
      - name: Build the E2B template of the commit
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::Add the repository secret E2B_API_KEY."
            exit 1
          fi
          uv sync --locked
          # A commit from before the content alias has no --print-alias. It keeps the alias
          # of its commit, so a promotion or a rollback to it still works.
          if uv run python -m sama.sandbox.template --help | grep -q -- --print-alias; then
            ALIAS="$(uv run python -m sama.sandbox.template --print-alias)"
          else
            ALIAS="sama-runner-${SHA:0:12}"
          fi
          echo "TEMPLATE_ALIAS=${ALIAS}" >> "$GITHUB_ENV"
          uv run python -m sama.sandbox.template --alias "${ALIAS}"
      - name: Deploy the staging image of the commit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          ./flyctl deploy --config deploy/fly.production.toml --ha=false
          --image "registry.fly.io/sama-staging:main-${SHA}" --wait-timeout 10m
          --env "SAMA_SANDBOX_TEMPLATE=${TEMPLATE_ALIAS}"
      - name: Check the health of each part
        run: |
          for path in /healthz /tools/healthz /model/healthz; do
            curl -sSf --retry 10 --retry-all-errors --retry-delay 3 --max-time 10 \
              "https://sama-production.fly.dev${path}" > /dev/null
          done
      # The release notification (docs/architecture.md, Section 19.3). It runs also when the
      # deploy fails or is cancelled, and it never fails the job. The script comes from the
      # commit of this workflow, because an older deployed commit does not have it.
      - name: Check out the release notification script
        if: always() && env.RELEASE_WEBHOOK_SET == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-notify
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/release-notify.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Send the release notification
        if: always() && env.RELEASE_WEBHOOK_SET == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.VORFLUX_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_ENVIRONMENT: production
          DEPLOY_SERVICE: sama
          DEPLOY_SHA: ${{ env.SHA }}
          DEPLOY_REF: refs/heads/main
          DEPLOY_IMAGE_LABEL: main-${{ env.SHA }}
          RELEASE_NOTIFY_GIT_DIR: .release-notify
        run: bash .release-notify/scripts/release-notify.sh || true
